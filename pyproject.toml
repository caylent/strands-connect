[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "strands-connect"
version = "0.2.1"
description = "Contact-scoped Amazon Connect voice transport, tools, and hooks for Strands"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.15"
authors = [{name = "Caylent"}]
# BidiAgent and the two small provider compatibility seams are experimental.
dependencies = ["strands-agents==1.56.0", "boto3>=1.43.98,<2", "websockets>=15.0.1,<16"]

[project.optional-dependencies]
openai = ["openai[realtime]==2.54.0"]
gemini = ["google-genai==2.24.0"]
sonic = ["strands-agents[bidi]==1.56.0"]
agentcore = ["bedrock-agentcore==1.23.1"]

[project.urls]
Repository = "https://github.com/caylent/strands-connect"

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/strands_connect"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
